name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build atdll (${{ matrix.platform }})
        run: msbuild atdll\atdll.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal
      - name: Build atloader (${{ matrix.platform }})
        run: msbuild atloader\atloader.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal
      - name: Build attest (${{ matrix.platform }})
        run: msbuild attest\attest.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal
